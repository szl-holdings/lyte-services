version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      github_actions:
        patterns:
          - "*"

  # Keep the same dependency in top-level pins and all hash-locked CI
  # manifests in ONE Dependabot proposal. Closure parity remains fail-closed;
  # a proposal must still pass source and hashed-lock tests before admission.
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/requirements/ci"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    # granite-tsfm 0.3.12 requires torch <2.12; don't silently break extras.
    ignore:
      - dependency-name: "torch"
        versions: [">=2.12"]
    groups:
      pip:
        group-by: dependency-name
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    # The Docker version matcher uses Bundler syntax. This repo supports
    # Python >=3.12,<3.15; do not propose unsupported 3.15+ images before
    # the full release/test and dependency contracts deliberately advance.
    ignore:
      - dependency-name: "python"
        versions: [">= 3.15"]
    groups:
      docker:
        patterns:
          - "*"

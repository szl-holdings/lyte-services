name: Forecast workbench browser boundary
"on":
  pull_request:
    paths:
      - 'lyte/ui/forecast.*'
      - 'lyte/api/routes_forecast_workbench.py'
      - 'lyte/intelligence/forecast_inspection.py'
      - 'tests/forecast-workbench.test.mjs'
      - '.github/workflows/forecast-workbench.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: forecast-workbench-${{ github.ref }}
  cancel-in-progress: true
jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check supported Node and test pure browser boundary
        run: |
          node --version
          node --check lyte/ui/forecast.mjs
          node --test tests/forecast-workbench.test.mjs

# Review-only proposals. Untrusted PR content never receives repository-write
# authority, supplies executable header commands, or replaces the policy helper.
name: dependabot-lockfile-reconcile

on:
  pull_request:
    paths:
      - requirements.txt
      - requirements-test.txt
      - pyproject.toml
      - requirements/ci/**
      - tools/propose_ci_locks.py
      - tests/test_lock_proposal.py
      - .github/workflows/dependabot-lockfile-reconcile.yml

permissions:
  contents: read

concurrency:
  group: lockfile-proposal-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  proposal-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Offline proposal contracts
        run: python -I -B -m unittest discover -s tests -p test_lock_proposal.py -v

  propose:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Trusted base policy at immutable revision.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      # Candidate revision is untrusted requirements data only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.7'
          enable-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Produce bounded patch without executing candidate code
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          POLICY_HEAD: ${{ github.event.pull_request.base.sha }}
        run: |
          python -I -B "$GITHUB_WORKSPACE/trusted/tools/propose_ci_locks.py" \
            --root "$GITHUB_WORKSPACE/candidate" \
            --output "$RUNNER_TEMP/lock-proposal" \
            --source-head "$SOURCE_HEAD" --policy-head "$POLICY_HEAD"
      # Preserve review artifact, never commit or write back to PR.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lock-proposal-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/lock-proposal/lockfiles.patch
            ${{ runner.temp }}/lock-proposal/proposal.json
          if-no-files-found: error
          retention-days: 7

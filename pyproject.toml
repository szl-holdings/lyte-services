[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "szl-lyte-enterprise"
version = "4.0.0"
description = "Governed business-observability Signal Lattice"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "SZL Holdings" }]
dependencies = [
  "alembic==1.20.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "opentelemetry-api==1.45.0",
  "opentelemetry-instrumentation-fastapi==0.66b0",
  "opentelemetry-sdk==1.45.0",
  "orjson==3.12.0",
  "prometheus-client==0.26.0",
  "psycopg[binary]==3.3.6",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "PyJWT[crypto]==2.15.0",
  "SQLAlchemy==2.1.0",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "PyYAML==6.0.3",
  "ruff==0.16.9",
]

[project.scripts]
lyte = "lyte.app:run"

[project.urls]
Homepage = "https://github.com/szl-holdings/lyte-services"
Source = "https://github.com/szl-holdings/lyte-services"
Issues = "https://github.com/szl-holdings/lyte-services/issues"
Changelog = "https://github.com/szl-holdings/lyte-services/releases"

[tool.hatch.build.targets.wheel]
packages = ["lyte", "lyte_engine", "lyte_api"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.szl.release]
import_names = ["lyte", "lyte_api", "lyte_engine"] # wheel top-level import names; the release gate fails if the built wheel differs

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "szl-lyte-enterprise"
version = "4.0.0"
description = "Governed business-observability Signal Lattice"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
authors = [{ name = "SZL Holdings" }]
dependencies = [
  "alembic==1.20.1",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "opentelemetry-api==1.45.2",
  "opentelemetry-instrumentation-fastapi==0.66b2",
  "opentelemetry-sdk==1.45.2",
  "orjson==3.13.0",
  "prometheus-client==0.26.0",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "PyJWT[crypto]==2.15.1",
  "SQLAlchemy==2.1.6",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
# Opt-in lanes: `import lyte` needs only the dependencies above. Extras are pinned like core,
# at the versions installed and tested together on 2026-11-03.
# tests/test_dependency_contract.py maps every third-party import to core, test or an extra.
# browser: playwright for tools/forecast_workbench_browser.py and
# tools/verify_native_frontdoor.py; websockets (also pulled in by uvicorn[standard]) for
# tools/capture_ui_evidence.py. Chromium is not a Python package: install it separately.
browser = [
  "playwright==1.64.1",
  "websockets==17.4",
]
# granite: lyte/intelligence/granite_timeseries.py (lazy, guarded imports) and
# benchmarks/granite_checkpoint_probe.py. granite-tsfm provides the tsfm_public module and
# requires Python <3.14 and torch <2.12, so this extra cannot install on Python 3.14.
# For a CPU-only torch, install it from https://download.pytorch.org/whl/cpu first.
granite = [
  "granite-tsfm==0.3.12",
  "pandas==3.1.0",
  "torch==2.13.0",
]
test = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1",
  "pytest-cov==7.1.0",
  "packaging==26.3",
  "PyYAML==6.0.3",
  "ruff==0.17.3",
]

[project.scripts]
lyte = "lyte.app:run"

[project.urls]
Homepage = "https://github.com/szl-holdings/lyte-services"
Source = "https://github.com/szl-holdings/lyte-services"
Issues = "https://github.com/szl-holdings/lyte-services/issues"
Changelog = "https://github.com/szl-holdings/lyte-services/releases"

[tool.hatch.build.targets.wheel]
packages = ["lyte", "lyte_engine", "lyte_api"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.szl.release]
import_names = ["lyte", "lyte_api", "lyte_engine"] # wheel top-level import names; the release gate fails if the built wheel differs
